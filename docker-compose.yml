services:
  # ── Datos ──────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: music4all
      POSTGRES_PASSWORD: music4all
      POSTGRES_DB: music4all
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U music4all -d music4all"]
      interval: 10s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    command: valkey-server --appendonly yes
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Aplicación ─────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    ports:
      - "8000:8000"
    environment:
      - TIDAL_QUALITY=LOSSLESS
      # Carpeta persistente de descargas = el volumen montado abajo. Sin esta
      # variable los ficheros caen en un temporal del contenedor: se borran al
      # evictar el motor y engordan el disco de Docker, no el volumen.
      - DOWNLOAD_DIR=/app/downloads
      - REDIS_URL=redis://valkey:6379
      - DATABASE_URL=postgresql://music4all:music4all@postgres:5432/music4all
      # Cifra los tokens Tidal en reposo. Se toma del .env de la raíz (ignorado por
      # git) o del entorno; nunca se hardcodea aquí. Si va vacía, el backend usa una
      # clave efímera por proceso: con --reload, cada edición de un archivo reinicia
      # uvicorn, genera otra clave y deja los tokens guardados indescifrables — la
      # sesión de app sigue viva pero Tidal responde 401 y la web dice "expirada".
      - SESSION_ENCRYPTION_KEY=${SESSION_ENCRYPTION_KEY:-}
      # Web Push (PWA P1-C) — VAPID. Del .env de la raíz; vacías = push desactivado.
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:admin@example.com}
      # uv uses copy mode because the bind-mount is a cross-filesystem Windows volume
      - UV_LINK_MODE=copy
    volumes:
      - ./backend:/app
      # Preserve the Linux venv built in the image — prevents the Windows host .venv
      # from being used inside the Linux container (cross-OS path mismatch breaks certifi)
      - backend_venv:/app/.venv
      - ./downloads:/app/downloads
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:8000
      # Dev: el navegador conecta el WebSocket directo al backend (host :8000),
      # saltándose el proxy WS de Next.js dev-server (roto en 14.2). En producción
      # esta var no se define y se usa same-origin vía nginx. Ver ws.config.ts.
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
      # Usa el pnpm pre-instalado en la imagen en vez de auto-instalar el pin de
      # `packageManager` desde npmjs al arrancar — el contenedor así no depende de
      # tener red a npmjs/Cloudflare para bootear (que falla en algunas redes).
      - npm_config_manage_package_manager_versions=false
    volumes:
      - ./frontend:/app
      - frontend_pnpm_store:/app/node_modules
      # Preserva el build de Next del contenedor — mismo motivo que backend_venv:
      # el bind-mount de arriba trae ./frontend/.next del host Windows, y un
      # `pnpm build` en el host (gates de CI/local) deja ahí un build de PRODUCCIÓN
      # que el dev-server no reconoce: sirve HTML que apunta a chunks inexistentes
      # → 404 en CSS/JS, MODULE_NOT_FOUND en webpack-runtime y la web sin estilos.
      - frontend_next_cache:/app/.next
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => {process.exit(r.statusCode === 307 || r.statusCode === 200 ? 0 : 1)})"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

  # ── Observabilidad ─────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.49.0
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Reglas de alerta (Fase 6). Activas cuando prometheus.yml declara:
      #   rule_files:
      #     - /etc/prometheus/alerts.yml
      - ./infrastructure/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    depends_on:
      backend:
        condition: service_healthy

  grafana:
    image: grafana/grafana:10.3.0
    ports:
      - "3001:3000"
    environment:
      # Credenciales por variable de entorno. En producción, setear GRAFANA_ADMIN_USER
      # y GRAFANA_ADMIN_PASSWORD en el .env (el default 'admin' es solo para dev local).
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_LOG_LEVEL=warn
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

  loki:
    image: grafana/loki:2.9.0
    ports:
      - "3100:3100"
    volumes:
      - ./infrastructure/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml

  promtail:
    image: grafana/promtail:2.9.0
    volumes:
      - ./infrastructure/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

volumes:
  postgres_data:
  valkey_data:
  backend_venv:
  prometheus_data:
  grafana_data:
  loki_data:
  downloads:
  frontend_pnpm_store:
  frontend_next_cache:
