[project]
name = "music-4-all-backend"
version = "0.1.0"
description = "Music 4 All Backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.2.2",
    "aiohttp>=3.13.0",
    "requests>=2.32.3",
    "mutagen==1.48.1",
    "tidalapi==0.8.11",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.51",
    "alembic>=1.18.5",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    # Observabilidad (Fase 6)
    "prometheus-fastapi-instrumentator>=8.1.0",
    "prometheus-client>=0.26.0",
    "python-json-logger>=2.0.0",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.22.0",
    "opentelemetry-instrumentation-fastapi>=0.43b0",
    # Seguridad (Fase 7)
    "slowapi>=0.1.10",
    "cryptography>=49.0.0",
    "pywebpush>=2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
    "mypy>=2.3.0",
    "ruff>=0.16.1",
    "bandit>=1.7.0",
    "locust>=2.46.2",
    "responses>=0.26.2",
    "fakeredis>=2.37.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]   # B008: FastAPI Depends() en defaults es el patrón estándar

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: pruebas que descargan datos reales desde Tidal (requieren credenciales)",
]
