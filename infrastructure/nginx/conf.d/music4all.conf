# HSTS solo cuando la petición llegó de verdad por HTTPS. En el despliegue el TLS
# lo termina el proxy de delante (Coolify/Let's Encrypt) y nos pasa el esquema en
# X-Forwarded-Proto; en local, donde se sirve por HTTP plano, la variable queda
# vacía y nginx omite la cabecera (anunciar HSTS sin TLS dejaría el navegador sin
# poder volver a entrar). Así el mismo archivo vale para local y para producción.
map $http_x_forwarded_proto $hsts_header {
    https   "max-age=31536000; includeSubDomains";
    default "";
}

upstream backend {
    server backend:8000;
    keepalive 32;
}

upstream frontend {
    server frontend:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;

    # ── Seguridad ──────────────────────────────────────────
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # worker-src/manifest-src: necesarios para la PWA (service worker + manifest).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://resources.tidal.com; connect-src 'self' ws: wss:; font-src 'self'; worker-src 'self'; manifest-src 'self';" always;
    # HSTS: vacío (y por tanto omitido) mientras no se sirva por HTTPS. Ver el `map`.
    add_header Strict-Transport-Security $hsts_header always;
    # Ninguna de estas capacidades se usa: negarlas evita que un script inyectado
    # o un iframe las pida. `autoplay`/`fullscreen` sí, para el reproductor.
    add_header Permissions-Policy "accelerometer=(), autoplay=(self), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=()" always;

    # ── API REST → backend ─────────────────────────────────
    location /api/ {
        proxy_pass http://backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # ── WebSocket → backend ────────────────────────────────
    location /ws/ {
        proxy_pass http://backend/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Health check directo al backend ───────────────────
    location /health {
        proxy_pass http://backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # ── Frontend (Next.js) ────────────────────────────────
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}
