name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  PNPM_VERSION: "10"

jobs:
  # ── Backend: lint y formato ──────────────────────────────────────────────────
  lint-backend:
    name: "Backend — Lint & Format"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff — lint
        run: uv run ruff check .

      - name: Ruff — format check
        run: uv run ruff format --check .

  # ── Frontend: type-check y build ────────────────────────────────────────────
  build-frontend:
    name: "Frontend — Type-check & Build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build (type-check + compilation)
        run: pnpm build

  # ── Frontend: unit tests (Vitest) ────────────────────────────────────────
  test-frontend:
    name: "Frontend — Unit Tests (Vitest)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

      # Mismo criterio que pip-audit en el backend: informativo, no bloqueante.
      # `--prod` deja fuera el toolchain de desarrollo, que no se despliega.
      - name: pnpm audit — CVEs de dependencias (informativo)
        continue-on-error: true
        run: pnpm audit --prod

  # ── Frontend: E2E tests (Playwright, mocked backend) ────────────────────
  test-e2e:
    name: "Frontend — E2E Tests (Playwright)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Run E2E tests
        run: pnpm exec playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # ── Backend: tests ────────────────────────────────────────────────────────
  test-backend:
    name: "Backend — Tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      redis:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: music4all
          POSTGRES_PASSWORD: music4all
          POSTGRES_DB: music4all
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U music4all"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      REDIS_URL: redis://localhost:6379
      DATABASE_URL: postgresql://music4all:music4all@localhost:5432/music4all
      # Credenciales opcionales para tests/validation/*.py marcados @pytest.mark.slow
      # (descargas reales desde Tidal). Si no están configurados como secrets,
      # esos tests se omiten automáticamente (fixture `tidal_session`).
      TIDAL_TEST_ACCESS_TOKEN: ${{ secrets.TIDAL_TEST_ACCESS_TOKEN }}
      TIDAL_TEST_REFRESH_TOKEN: ${{ secrets.TIDAL_TEST_REFRESH_TOKEN }}
      TIDAL_TEST_TOKEN_TYPE: ${{ secrets.TIDAL_TEST_TOKEN_TYPE }}
      TIDAL_TEST_TRACK_ID: ${{ secrets.TIDAL_TEST_TRACK_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies (with dev)
        run: uv sync --frozen

      - name: Run tests
        # Sin bypass: un fallo de pytest debe bloquear el merge (la suite está en verde).
        run: uv run pytest tests/ -v --tb=short

  # ── Backend: seguridad (bandit) ──────────────────────────────────────────
  security-backend:
    name: "Backend — Security Scan"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dev dependencies
        run: uv sync --frozen

      - name: Bandit — security scan
        run: uv run bandit -r app/ -ll -f json -o bandit-report.json || [ $? -eq 0 ]

      # CVEs de las dependencias (SEC-05). Informativo a propósito: un aviso nuevo
      # publicado aguas arriba no debe bloquear un PR que no lo toca, pero tiene que
      # verse. Quien mergea lo revisa; Dependabot abre el PR de actualización.
      - name: pip-audit — CVEs de dependencias (informativo)
        continue-on-error: true
        run: |
          uv export --format requirements-txt --no-emit-project --no-dev --no-hashes -o requirements-audit.txt
          uvx pip-audit --requirement requirements-audit.txt --no-deps

      - name: Upload bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-security-report
          path: backend/bandit-report.json

  # ── Docker: build de imágenes ────────────────────────────────────────────
  docker-build:
    name: "Docker — Build Images"
    runs-on: ubuntu-latest
    needs: [lint-backend, build-frontend, test-frontend, security-backend]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          target: production
          push: false
          tags: music4all-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          target: builder
          push: false
          tags: music4all-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

